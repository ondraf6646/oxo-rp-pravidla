<!DOCTYPE html>

<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>OXO RP — Pravidla jednoduše</title>

<style>
:root{--bg:#070b12;--bg2:#0b111b;--panel:#0d1521;--panel2:#101a28;--line:#1d2a3c;--line2:#24354b;--text:#f2f6fc;--muted:#8c9aae;--accent:#1687ff;--accent2:#65b3ff;--good:#35d39a;--warn:#ffb84d;--danger:#ff5f6d;--shadow:0 20px 60px rgba(0,0,0,.28);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,rgba(22,135,255,.12),transparent 60%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.6}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 80%);opacity:.35}
::selection{background:rgba(22,135,255,.3);color:white}a{color:inherit}
.sidebar{position:fixed;z-index:20;left:0;top:0;width:286px;height:100vh;padding:22px 16px 18px;background:rgba(7,11,18,.9);backdrop-filter:blur(18px);border-right:1px solid var(--line);overflow:auto}.brand{height:78px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.brand img{width:176px;max-height:66px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(22,135,255,.14))}.side-title{margin:10px 11px 9px;color:#65758b;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.side-meta{display:flex;gap:7px;margin:0 9px 16px}.pill{border:1px solid var(--line);background:#0c131e;color:#91a1b5;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:700}.pill.live{color:#77ddb5;border-color:rgba(53,211,154,.2)}nav{display:grid;gap:4px}nav a{position:relative;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:11px;text-decoration:none;color:#91a0b3;font-size:12px;font-weight:650;transition:.18s ease;border:1px solid transparent}nav a span{width:25px;color:#53657d;font-size:10px;font-weight:900;letter-spacing:.5px}nav a:hover{color:#eaf3ff;background:#0e1724;border-color:#17263a;transform:translateX(2px)}nav a.active{color:#fff;background:linear-gradient(90deg,rgba(22,135,255,.15),rgba(22,135,255,.04));border-color:rgba(22,135,255,.2)}nav a.active:before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 4px 4px 0;box-shadow:0 0 16px rgba(22,135,255,.65)}nav a.active span{color:var(--accent2)}
main{margin-left:286px;max-width:1200px;padding:42px 54px 90px}.hero{position:relative;overflow:hidden;padding:42px 44px 38px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(16,26,40,.94),rgba(10,16,25,.94));box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:"";position:absolute;width:380px;height:380px;right:-150px;top:-190px;border-radius:50%;background:rgba(22,135,255,.1);filter:blur(3px)}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#76baff;font-size:11px;font-weight:850;letter-spacing:1.8px;text-transform:uppercase}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 15px rgba(22,135,255,.8)}h1{font-size:clamp(42px,6vw,72px);line-height:1;margin:12px 0 16px;letter-spacing:-2.8px} .hero p{max-width:760px;color:#9aa9bc;font-size:15px;margin:0;line-height:1.75}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}.stat{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(7,12,19,.45)}.stat strong{display:block;font-size:19px}.stat span{display:block;color:#718197;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-top:2px}
.toolbar{position:sticky;z-index:10;top:14px;display:flex;gap:10px;align-items:center;padding:10px;margin:0 0 28px;border:1px solid var(--line);border-radius:16px;background:rgba(10,16,25,.82);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.18)}.search{flex:1;position:relative}.search:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:22px;color:#61738a;pointer-events:none}.search input{width:100%;height:44px;border:1px solid #1b2a3e;border-radius:11px;background:#0a111b;color:#eaf2fc;outline:none;padding:0 44px;font-size:13px}.search input:focus{border-color:rgba(22,135,255,.65);box-shadow:0 0 0 3px rgba(22,135,255,.1)}.result-count{white-space:nowrap;padding:0 13px;color:#73849a;font-size:11px;font-weight:800}.top-btn{height:44px;border:1px solid var(--line);border-radius:11px;background:#0b131e;color:#a9b6c7;padding:0 13px;cursor:pointer;font-weight:800}.top-btn:hover{border-color:var(--line2);color:#fff}.mobile-btn{display:none}
.section{margin:0 0 30px;scroll-margin-top:90px}.section-head{display:flex;align-items:center;gap:13px;margin:0 0 12px;padding:0 4px}.section-head>span{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:rgba(22,135,255,.1);border:1px solid rgba(22,135,255,.2);color:#64b3ff;font-size:11px;font-weight:900}.section-head h2{font-size:24px;letter-spacing:-.7px;margin:0}.rules{display:grid;gap:9px}.rule{position:relative;display:grid;grid-template-columns:62px 1fr;gap:15px;padding:20px 22px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,rgba(13,21,33,.95),rgba(10,16,25,.95));transition:.18s ease;scroll-margin-top:100px}.rule:hover{border-color:#2a405b;transform:translateY(-1px);box-shadow:0 12px 32px rgba(0,0,0,.18)}.rule-no{font-size:11px;font-weight:950;color:#4e6784;padding-top:3px;letter-spacing:.5px}.rule-main h3{margin:0 0 7px;font-size:17px;letter-spacing:-.2px}.rule-main>p{margin:0;color:#a9b6c7;font-size:13px;line-height:1.7}.example{margin-top:13px;padding:12px 14px;border-radius:11px;background:#0a121d;border:1px solid #18273a;border-left:3px solid var(--accent)}.example-title{display:flex;align-items:center;gap:7px;color:#65b4ff;font-size:10px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}.example-title:before{content:"✓";display:grid;place-items:center;width:17px;height:17px;border-radius:5px;background:rgba(22,135,255,.12)}.example p{margin:0;color:#8fa0b4;font-size:12px;line-height:1.65}.rule.hidden,.section.hidden{display:none}
footer{margin-top:45px;padding:20px 4px;border-top:1px solid var(--line);color:#617188;font-size:11px;text-align:center}.backtop{position:fixed;right:24px;bottom:24px;width:43px;height:43px;border:1px solid var(--line2);border-radius:12px;background:rgba(11,18,28,.9);color:#b8c6d7;cursor:pointer;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(10px)}.backtop.show{opacity:1;pointer-events:auto}.progress{position:fixed;z-index:50;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(22,135,255,.65)}
@media(max-width:1050px){.sidebar{width:245px}main{margin-left:245px;padding:30px 30px 70px}.hero{padding:34px}.rule{grid-template-columns:52px 1fr}}
@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.25s;width:285px;box-shadow:30px 0 80px rgba(0,0,0,.4)}body.menu-open .sidebar{transform:translateX(0)}main{margin-left:0;padding:16px 14px 60px}.mobile-btn{display:block}.toolbar{top:8px}.hero{padding:30px 22px;border-radius:18px}.hero-grid{grid-template-columns:1fr}.hero p{font-size:13px}.section-head h2{font-size:21px}.rule{grid-template-columns:1fr;gap:5px;padding:17px}.rule-no{font-size:10px}.rule-main h3{font-size:16px}.rule-main>p{font-size:12.5px}.result-count{display:none}}
</style></head>
